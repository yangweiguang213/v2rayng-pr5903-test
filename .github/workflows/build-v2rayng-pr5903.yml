name: Build v2rayNG PR5903 (Shizuku Hotspot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v2rayng-pr5903.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out original PR source
        uses: actions/checkout@v4
        with:
          repository: eliotcougar/v2rayNG
          ref: 9b5c6bf1be45c6b845190106910ad7d2617e75af
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install Android NDK
        run: |
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install 'ndk;30.0.16248370'
          test -x "$ANDROID_HOME/ndk/30.0.16248370/ndk-build"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Build HEV native libraries
        run: |
          bash compile-hevtun.sh
          cp -r libs V2rayNG/app/

      - name: Download matching Xray AAR
        run: |
          tag=$(git -C AndroidLibXrayLite describe --tags --abbrev=0)
          echo "Using AndroidLibXrayLite tag: $tag"
          mkdir -p V2rayNG/app/libs
          curl --fail --location --retry 3 \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${tag}/libv2ray.aar" \
            --output V2rayNG/app/libs/libv2ray.aar

      - name: Use separate Android package name
        run: |
          sed -i '/^    buildTypes {$/a\        getByName("debug") { applicationIdSuffix = ".pr5903" }' V2rayNG/app/build.gradle.kts
          grep -A 3 'buildTypes {' V2rayNG/app/build.gradle.kts

      - name: Build arm64 test APK (debug signed)
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePlaystoreDebug -PABI_FILTERS=arm64-v8a --no-daemon --stacktrace

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-PR5903-arm64-debug
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 7
