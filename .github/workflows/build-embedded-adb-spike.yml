name: v2rayNG Hotspot Release

on:
  push:
    branches: [release/hotspot]
    paths:
      - '.github/workflows/build-embedded-adb-spike.yml'
      - 'overlay/**'
  workflow_dispatch:

concurrency:
  group: embedded-shell-single-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out original PR source
        uses: actions/checkout@v4
        with:
          repository: eliotcougar/v2rayNG
          ref: 9b5c6bf1be45c6b845190106910ad7d2617e75af
          submodules: recursive
          fetch-depth: 0

      - name: Check out integration overlay
        uses: actions/checkout@v4
        with:
          repository: yangweiguang213/v2rayng-pr5903-test
          ref: ${{ github.sha }}
          path: integration

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install Android NDK
        run: |
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install 'ndk;30.0.16248370'
          test -x "$ANDROID_HOME/ndk/30.0.16248370/ndk-build"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Configure stable hotspot package and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('V2rayNG/app/build.gradle.kts')
          s = p.read_text()
          assert s.count('applicationId = "com.v2ray.ang"') == 1
          s = s.replace('applicationId = "com.v2ray.ang"', 'applicationId = "com.v2ray.ang.hotspot"')
          s = s.replace('versionCode = 750', 'versionCode = 751')
          s = s.replace('versionName = "2.3.10"', 'versionName = "2.3.10-hotspot.1"')
          p.write_text(s)
          PY

      - name: Integrate internal ADB pairing and shell backend
        run: |
          cp integration/overlay/V2rayNG/app/src/main/java/com/v2ray/ang/ui/EmbeddedAdbProbePanel.kt V2rayNG/app/src/main/java/com/v2ray/ang/ui/
          cp integration/overlay/V2rayNG/app/src/main/java/com/v2ray/ang/ui/LocalAdbDiscovery.kt V2rayNG/app/src/main/java/com/v2ray/ang/ui/
          cp integration/overlay/V2rayNG/app/src/main/java/com/v2ray/ang/ui/EmbeddedAdbPairingService.kt V2rayNG/app/src/main/java/com/v2ray/ang/ui/
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("V2rayNG/app/build.gradle.kts")
          text = gradle.read_text()
          marker = "    implementation(libs.shizuku.api)"
          assert text.count(marker) == 1
          text = text.replace(marker, marker + chr(10) +
            '    implementation("com.flyfishxu:kadb-android:2.1.5")')
          # Android 17 local network access is requested explicitly in the pairing UI.
          assert 'targetSdk = 37' in text
          packaging_marker = '    packaging {' + chr(10)
          assert text.count(packaging_marker) == 1
          text = text.replace(packaging_marker, packaging_marker + '        resources { excludes += setOf("META-INF/LICENSE.md", "META-INF/NOTICE.md") }' + chr(10))
          gradle.write_text(text)
          screen = Path("V2rayNG/app/src/main/java/com/v2ray/ang/ui/TetheringScreen.kt")
          original = screen.read_text()
          marker = "            Spacer(modifier = Modifier.height(8.dp))"
          assert marker in original, "Tethering screen insertion point changed"
          screen.write_text(original.replace(marker, "            EmbeddedAdbProbePanel(onReady = { onAction(ShizukuAction.Refresh) })" + chr(10) + marker, 1))
          PY
          python3 integration/overlay/apply_embedded_shell.py

      - name: Validate generated integration sources
        run: |
          python3 -m py_compile integration/overlay/apply_embedded_shell.py
          grep -q "PolishedTetheringScreen(state" V2rayNG/app/src/main/java/com/v2ray/ang/ui/TetheringScreen.kt
          grep -q "通知栏填写" V2rayNG/app/src/main/java/com/v2ray/ang/ui/EmbeddedAdbProbePanel.kt
          ! grep -Eq "OutlinedTextField|manualHost|manualPairPort|manualConnectPort" V2rayNG/app/src/main/java/com/v2ray/ang/ui/EmbeddedAdbProbePanel.kt
          grep -q 'targetSdk = 37' V2rayNG/app/build.gradle.kts
          grep -q 'ACCESS_LOCAL_NETWORK' V2rayNG/app/src/main/AndroidManifest.xml
          grep -q 'getContentProviderExternal' V2rayNG/app/src/main/java/com/v2ray/ang/shizuku/EmbeddedShellPublisher.kt
          test -f V2rayNG/app/src/main/java/com/v2ray/ang/ui/LocalAdbDiscovery.kt
          grep -q "resolveService(" V2rayNG/app/src/main/java/com/v2ray/ang/ui/LocalAdbDiscovery.kt
          ! grep -q "registerServiceInfoCallback" V2rayNG/app/src/main/java/com/v2ray/ang/ui/LocalAdbDiscovery.kt
          grep -q "EMBEDDED_APP_PROCESS_OK" V2rayNG/app/src/main/java/com/v2ray/ang/shizuku/EmbeddedShellStarter.kt
          grep -q "APP_PROCESS_QUEUED" V2rayNG/app/src/main/java/com/v2ray/ang/ui/EmbeddedAdbProbePanel.kt
          grep -q "EmbeddedAdbPairingService" V2rayNG/app/src/main/AndroidManifest.xml
          grep -q "ACTION_REPLY" V2rayNG/app/src/main/java/com/v2ray/ang/ui/EmbeddedAdbPairingService.kt
          ! grep -q 'kadb-mdns' V2rayNG/app/build.gradle.kts

      - name: Build HEV native libraries
        run: |
          bash compile-hevtun.sh
          cp -r libs V2rayNG/app/

      - name: Download matching Xray AAR
        run: |
          tag=$(git -C AndroidLibXrayLite describe --tags --abbrev=0)
          echo "Using AndroidLibXrayLite tag: $tag"
          mkdir -p V2rayNG/app/libs
          curl --fail --location --retry 3 \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${tag}/libv2ray.aar" \
            --output V2rayNG/app/libs/libv2ray.aar

      - name: Build release APK and temporary migration APK
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePlaystoreDebug :app:assemblePlaystoreRelease -PABI_FILTERS=arm64-v8a --no-daemon --stacktrace

      - name: Verify independent package ID
        run: |
          set -e
          apk="$(find V2rayNG/app/build/outputs/apk/playstore/release -name '*arm64-v8a*.apk' -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.v2ray.ang.hotspot'"
          ! "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" | grep -q 'application-debuggable'

      - name: Package unsigned release and signing verifier
        run: |
          mkdir -p release-package/release release-package/migration release-package/tools
          cp V2rayNG/app/build/outputs/apk/playstore/release/*arm64-v8a*.apk release-package/release/
          cp V2rayNG/app/build/outputs/apk/playstore/debug/*arm64-v8a*.apk release-package/migration/
          cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" release-package/tools/

      - name: Upload release package for local private signing
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-hotspot-release-arm64
          path: release-package/
          if-no-files-found: error
          retention-days: 7
